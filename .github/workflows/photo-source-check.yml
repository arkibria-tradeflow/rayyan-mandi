name: Check Wikimedia photo availability
on:
  push:
    paths: ['.github/workflows/photo-source-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Wikimedia image servers
        run: |
          python3 - <<'PY'
          import urllib.request, time
          urls=[
          'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Mandi_chicken.jpg/500px-Mandi_chicken.jpg',
          'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Chicken_fry_piece_mandi.jpg/500px-Chicken_fry_piece_mandi.jpg',
          'https://commons.wikimedia.org/wiki/Special:FilePath/Mandi_chicken.jpg',
          'https://images.pexels.com/photos/18698228/pexels-photo-18698228.jpeg?auto=compress%26cs=tinysrgb%26w=700',
          'https://images.pexels.com/photos/29300022/pexels-photo-29300022.jpeg',
          'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=480'
          ]
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 RayyanMenuDemo/1.0'}),timeout=9) as r:
                      b=r.read(5000)
                      print(url, 'HTTP',r.status,'Bytes-read',len(b),flush=True)
              except Exception as e:print(url,'ERROR',type(e).__name__,str(e)[:140],flush=True)
          PY
