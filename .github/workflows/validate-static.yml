name: Validate Rayyan static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check menu-extras.js
          node --check home-extras.js
          node --check rayyan-branches-data.js
          node --check branch-info.js
          node --check photo-enhancements.js
          node --check order-sync.js
      - name: Verify HTML, assets and menu data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          home=Path('index.html').read_text()
          menu=Path('menu.html').read_text()
          extra=Path('menu-extras.js').read_text()
          for filename in ['index.html','menu.html','branches.html','order.html','home-extras.css','home-extras.js','menu-extras.css','menu-extras.js','rayyan-branches-data.js','branch-info.css','branch-info.js','photo-enhancements.css','photo-enhancements.js','order-sync.js']:
              assert Path(filename).is_file(),filename
          assert 'home-extras.css' in home and 'home-extras.js' in home
          assert Path('official-menu.html').exists() and Path('data/official-menu.json').exists()
          import json
          official=json.loads(Path('data/official-menu.json').read_text())
          assert len(official['items'])==71
          assert any(x['name']=='Chicken Mandi' and x['price']==29 for x in official['items'])
          assert any(x['name']=='Haneeth Shoulder' and x['price']==89 for x in official['items'])
          assert 'menu-extras.css' in menu and 'menu-extras.js' in menu
          assert 'id="menuArea"' in menu and 'id="menuSection"' in home
          assert len(re.findall(r'^\s*\["',extra,re.M))==32, "Expected 32 additional menu items"
          assert 'Chicken Mandi' in extra and 'Kunafa' in extra and 'Hammour Mandi' in extra
          assert 'Al Rigga' in extra and 'Confirm' in extra
          for filename in ['index.html','menu.html']:
              page=Path(filename).read_text()
              for ref in ['rayyan-branches-data.js','branch-info.js','order-sync.js','branch-info.css']:
                  assert ref in page,(filename,ref)
          assert 'photo-enhancements.js' in menu
          assert 'Review WhatsApp message' in Path('order.html').read_text()
          assert 'Al Mashaf' in Path('rayyan-branches-data.js').read_text()
          order=Path('order.html').read_text()
          import re
          inline=re.findall(r'<script>(.*?)</script>',order,re.S)
          assert inline, 'Expected inline checkout script'
          Path('/tmp/order-check.js').write_text(inline[-1])
          inline_official=re.findall(r'<script>(.*?)</script>',Path('official-menu.html').read_text(),re.S)
          assert inline_official
          Path('/tmp/official-check.js').write_text(inline_official[-1])
          print('PASS: HTML references, six branches, PDF-sourced 71-item catalog, checkout and photos')
          PY
          node --check /tmp/order-check.js
          node --check /tmp/official-check.js
