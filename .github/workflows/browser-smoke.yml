name: Rayyan mobile browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site and test key customer journeys
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rayyan-server.log 2>&1 &
          sleep 2
          node tests/mobile-smoke.cjs
